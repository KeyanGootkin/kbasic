[project]
name = "kbasic"
version = "0.2.3"
description = "Keyan's basic utility functions."
readme = "README.md"
authors = [
  { name="Keyan Gootkin", email="keyangootkin@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "colorist>=1.8.12",
    "numpy>=2.4.2",
    "pylatexenc>=2.10",
    "scipy>=1.17.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
addopts = "-v --maxfail=1 --cov=kbasic --import-mode=importlib"
